name: Mantener activo

# GitHub apaga los horarios automáticos si el repositorio pasa 60 días sin cambios.
# Esto hace un cambio mínimo el día 1 de cada mes para que nunca se apaguen.
on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  latido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .ultimo_latido
          git config user.name "huella-bot"
          git config user.email "huella-bot@users.noreply.github.com"
          git add .ultimo_latido
          git commit -m "latido mensual" || exit 0
          git push
